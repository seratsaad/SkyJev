# Held-out tasks, written 2026-09-23 BEFORE any JEV_PLUS fix was built or tuned.
# Same five categories and mostly the same sites as tasks/, different objects, plus two sites the
# development set never touches (JPL SBDB, the arXiv listings). Do not run an agent on these until
# the fixes are frozen; see IMPROVING_JEV.md. Verifier validation (no agent, no model) is allowed.

- id: ho_simbad_sirius_001
  category: lookup
  difficulty: low
  goal: >
    Open the SIMBAD main record page for the star Sirius.
  start_url: https://simbad.cds.unistra.fr/simbad/
  gold_url: https://simbad.cds.unistra.fr/simbad/sim-basic?Ident=Sirius
  goal_url: '(?i)simbad/sim-(basic|id)\?.*Ident=(Sirius|[^&]*alf(\+|%20|\s)*CMa)'
  verifier:
    type: all_of
    items:
      - {type: page_regex, value: "\\*\\s*alf\\s*CMa"}
      - {type: page_regex, value: "06 45 0"}
  timeout_seconds: 90

- id: ho_arxiv_lookup_002
  category: lookup
  difficulty: low
  goal: >
    Open the arXiv abstract page for the paper with identifier 1807.06209.
  start_url: https://arxiv.org/
  gold_url: https://arxiv.org/abs/1807.06209
  goal_url: 'arxiv\.org/abs/1807\.06209'
  verifier:
    type: all_of
    items:
      - {type: url_regex, value: "arxiv\\.org/abs/1807\\.06209"}
      - {type: page_contains, value: "arXiv:1807.06209"}
  timeout_seconds: 90

