[project]
name = "jev-astro-workshop"
version = "0.1.0"
description = "AstroWeb-JEV: does an ultrafast constrained browser agent survive scientific websites?"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jev-ultrafast",
  "browser-use==0.13.10",
  "pyyaml>=6",
  "pandas>=2.2,<3",
  "matplotlib>=3.9,<4",
  "python-dotenv>=1.0,<2",
  "websockets>=13",
  "nbformat>=5.11.1",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.4,<5",
    "nbformat>=5.10,<6",
    "ipykernel",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.uv.sources]
jev-ultrafast = { path = "../jev-ultrafast", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astroweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
# The notebook is generated by notebooks/build_notebook.py; lint the generator, not its output.
extend-exclude = ["notebooks/*.ipynb"]
