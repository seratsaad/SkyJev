    band: V
    mag_system: Vega
    snr: 50
    snr_unit: per_pix
    lam: 4500
    priority: 1
    t_exp: 1800
    appears_at: "2026-10-11T04:00:00Z"
    program: "ToO-3"
    pi: "Ting"
    notes: "New r-process candidate from a survey alert (arrives ~01:00 CLT)."

  - name: "Bright giant backup B-1"
    kind: backup
    template: galaxy
    sed: "bb:4500"
    ra: "04:40:18.0"
    dec: "-25:10:30"
    config: MIKE-RED
